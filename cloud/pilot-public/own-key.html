<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pilot 自有模型</title><body><h1>使用自己的模型</h1><p>在 Pilot 的设置 → 模型 → 供应商配置中接入供应商，再在用途分配中选择对话、操作屏幕、图片或视频模型。密钥保存在设备原有凭据系统，不需要填写到设备 Hub。</p><p>自有中继负责账号、设备连接、同步和转发。若运营者未配置模型供应商密钥，中继的模型代理会返回未配置错误，但认证与设备 Hub 仍可使用。</p><p>各设备必须连接同一个中继，使用同一账号登录。审批、停止及工具权限仍由执行设备的原链路处理。</p><a href="/app/">返回中继控制台</a></body></html>
