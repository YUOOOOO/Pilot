<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>Pilot</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7f6;color:#243732;font:15px/1.6 system-ui,sans-serif;-webkit-app-region:drag}.card{width:min(520px,90vw);padding:48px;border:1px solid #dce5e0;border-radius:20px;background:#fff;box-shadow:0 24px 70px #203a3010}.mark{display:grid;place-items:center;width:48px;height:48px;background:#176b56;color:white;border-radius:14px;font-size:25px;font-weight:700}h1{font-size:28px;letter-spacing:-1px;margin-bottom:4px}p{color:#687a73}.status{padding-top:24px;border-top:1px solid #edf0ee;margin-top:30px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#27987a;margin-right:10px;animation:pulse 1.5s infinite}button{border:1px solid #dce5e0;border-radius:8px;padding:9px 16px;background:white;color:#244d40;cursor:pointer;margin:12px 8px 0 0;-webkit-app-region:no-drag}button:focus-visible{outline:3px solid #87cdb5}#error{color:#994f3a;white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:12px;line-height:1.5;color:#9aada5;margin:6px 0 0}.elapsed{color:#9aada5;margin-left:8px;font-variant-numeric:tabular-nums}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style></head><body><main class="card"><div class="mark">P</div><h1>Pilot</h1><p>从想法到行动，你的 AI 工作台。</p><div class="status" role="status"><span class="dot" id="dot"></span><span id="status">正在启动本地服务…</span><span class="elapsed" id="elapsed"></span></div><p class="hint" id="hint">首次启动要加载本地服务（约 30 秒）；之后会复用后台服务，几秒内打开。</p><p id="error" hidden></p><button id="retry" hidden>重试启动</button><button id="logs">查看日志</button></main><script src="loading.js"></script></body></html>
